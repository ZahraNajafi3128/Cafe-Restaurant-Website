<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فرم ثبت نام</title>
  <link rel="stylesheet" href="signin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <div class="login-container">
    <div class="header">
      <h2>ثبت نام</h2>
    </div>

    <form action="signup.php" method="post" class="login-form">
      <label for="username">نام کاربری *</label>
      <input type="text" name="username" id="username" placeholder="نام کاربری" required>

      <label for="email">آدرس ایمیل *</label>
      <input type="email" name="email" id="email" placeholder="آدرس ایمیل" required>

      <label for="password">رمز عبور *</label>
      <div class="input-with-icon">
        <input type="password" name="password" id="password" placeholder="رمز عبور" required>
        <i class="fas fa-eye" id="togglePassword" aria-label="نمایش/مخفی کردن رمز"></i>
      </div>

      <label for="phone-number">شماره تلفن *</label>
      <input type="tel" name="phone" id="phone-number" placeholder="مثال: 0912xxxxxxx" required>

      <button type="submit" class="login-button">ثبت نام</button>

      <hr class="separator">

      <div class="no-account">
        <p>قبلاً حساب کاربری داشته‌اید؟</p>
        <a href="login.html" class="create-account-link">ورود به حساب</a>
      </div>
    </form>
  </div>

  <script>
    const toggleIcon = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (toggleIcon && passwordInput) {
      toggleIcon.addEventListener('click', () => {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.classList.remove('fa-eye');
          toggleIcon.classList.add('fa-eye-slash');
        } else {
          passwordInput.type = "password";
          toggleIcon.classList.remove('fa-eye-slash');
          toggleIcon.classList.add('fa-eye');
        }
      });
    }
  </script>
</body>
</html>
